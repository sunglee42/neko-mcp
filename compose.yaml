name: neko-mcp-release
services:
  neko:
    # Chromium profile locks include the hostname; keep it stable on recreation.
    hostname: neko-browser
    build: ./docker/neko
    restart: unless-stopped
    shm_size: 2gb
    ports:
      # NEKO_IP：127.0.0.1 僅限本機；主機區網 IPv4 則供內網存取。
      # Neko 網頁介面與 WebSocket 信令。
      - "${NEKO_IP:-127.0.0.1}:8080:8080/tcp"
      # MCP Bearer 驗證入口；不發布內部 MCP 8932 或 CDP 9222。
      - "${NEKO_IP:-127.0.0.1}:8931:8931/tcp"
      # WebRTC 音訊、影像與操作資料；映射範圍須與 EPR 一致。
      - "${NEKO_IP:-127.0.0.1}:52000-52100:52000-52100/udp"
    environment:
      TZ: ${TZ:-Asia/Taipei}
      NEKO_DESKTOP_SCREEN: 1920x1080@30
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_USER_PASSWORD:?Run scripts/init.ps1 first}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:?Run scripts/init.ps1 first}
      NEKO_WEBRTC_EPR: 52000-52100
      NEKO_WEBRTC_NAT1TO1: ${NEKO_IP:-127.0.0.1}
    volumes:
      - chromium-profile:/home/neko/.config/chromium
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.85@sha256:cc70a6922ff856f3aba0fe97d0d94220dc9a7f367f6d332facc6d81d9a91e60e
    restart: unless-stopped
    init: true
    # Share loopback with Neko: Chromium's debugging port stays private.
    network_mode: service:neko
    depends_on:
      - neko
    # Authenticated entry :8931 forwards to a private loopback backend :8932.
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MCP_PASSWORD: ${MCP_PASSWORD:?Run scripts/init.ps1 to generate MCP_PASSWORD}
    volumes:
      - ./docker/mcp/auth-proxy.mjs:/app/auth-proxy.mjs:ro
      - ./config.json:/app/config.json:ro
    entrypoint: ["node", "/app/auth-proxy.mjs"]
    command: []
volumes:
  chromium-profile:
